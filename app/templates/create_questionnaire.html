<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Questionnaire</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        h1 { color: #333; }
        .container { max-width: 600px; margin: auto; }
        form div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 3px; box-sizing: border-box; }
        textarea { min-height: 100px; }
        .btn { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 3px; cursor: pointer; }
        .btn:hover { background-color: #218838; }
        .btn-cancel { background-color: #6c757d; margin-left:10px;}
        .btn-cancel:hover { background-color: #545b62;}
            .alert { padding: 10px; margin-bottom:15px; border-radius:3px; text-align:center; }
            .alert-success { background-color:#d4edda; color:#155724; border:1px solid #c3e6cb; }
            .alert-error { background-color:#f8d7da; color:#721c24; border:1px solid #f5c6cb;}
            .alert-warning { background-color:#fff3cd; color:#856404; border:1px solid #ffeeba; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create New Questionnaire</h1>
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }}">{{ message }}</div> <!-- Define alert styles or use existing -->
                {% endfor %}
              {% endif %}
            {% endwith %}
        <form method="POST">
            <div>
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div>
                <label for="description">Description:</label>
                <textarea id="description" name="description" required></textarea>
            </div>
            <div>
                <button type="submit" class="btn">Create Questionnaire</button>
                <a href="{{ url_for('main.list_questionnaires') }}" class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
